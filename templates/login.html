{% extends "base.html" %}
{% block title %}Log in · /kurtz{% endblock %}
{% block body_class %}bg-primary{% endblock %}
{% block page %}
<div class="page page-center">
  <div class="container container-tight py-4">
    <form method="post" action="/admin/login" class="card card-md">
      <div class="card-body">
        <p class="text-center font-monospace fw-bold display-4 mb-4" aria-label="/kurtz"><span class="kurtz-slash" aria-hidden="true">/</span><span aria-hidden="true">kurtz</span></p>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus class="form-control">
        </div>
        {% if !error.is_empty() %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
